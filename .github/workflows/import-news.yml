name: Import news

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Import articles into Neon
        run: npm --prefix server run news:import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
